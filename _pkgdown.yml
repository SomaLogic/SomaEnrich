url: https://somalogic.github.io/SomaEnrich

development:
  mode: auto

authors:
  Amanda Hiser:
    href: https://github.com/amanda-hi
  SomaLogic Operating Co., Inc.:
    href: http://www.somalogic.com
  footer:
    roles: [fnd]
    text: "was developed by the Bioinformatics Dept. at"
  sidebar:
    roles: [cre, fnd]
    before: "Special :pray: to:"
    after: ":dna:"
  before: "[SomaEnrich](https://github.com/SomaLogic/SomaEnrich/) is proudly brought to you by:"
  after: ":dna:"

footer:
  structure:
    left: [logo, package, developed_by]
    right: built_with
  components:
    logo: "<img src='../favicon-16x16.png'>"

template:
  bootstrap: 5
  package: tidytemplate
  bslib:
    #bg: "#202123"      # dark theme
    #fg: "#B8BCC2"      # dark theme
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    base_font: {google: "Roboto"}

home:
  sidebar:
    structure: [links, help, oss, license, citation, authors, dev, toc]
    components:
      oss:
        title: Other Software
        text: >
          [SomaDataIO](https://somalogic.github.io/SomaDataIO/) <br />
          [SomaData](https://somalogic.github.io/SomaData/)
      help:
        title: Getting Help
        text: >
          [Ask a question](https://somalogic.github.io/SomaEnrich/SUPPORT.html) <br />
          [Report a bug](https://github.com/SomaLogic/SomaEnrich/issues)

  links:
  - text: Learn more about SomaScan
    href: http://www.somalogic.com
  - text: Read SomaScan tech notes
    href: http://www.somalogic.com/tech-notes/

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]

articles:
  - title: Introduction
    navbar: ~
    contents:
    - SomaEnrich

  - title: Analyte-to-Gene Mapping
    navbar: ~
    contents:
    - mapping-analytes-to-genes

reference:
  - title: Enrichment Analysis
    desc: >
      Core functions for performing pathway enrichment analyses
      with SomaScan data.
    contents:
    - somaORA
    - somaPrGSEA
    - prepareRanks

  - title: ID Mapping
    desc: >
      Functions for converting between SomaScan analyte identifiers
      and gene identifiers.
    contents:
    - apt2gene
    - gene2apt
    - go2apt
    - collapseAptData

  - title: Pathway Conversion
    desc: >
      Functions for converting pathway/feature set representations
      between gene-based and SomaScan analyte-based formats.
    contents:
    - aptPath2genePath
    - genePath2aptPath
    - gmt_gene2apt

  - title: Plotting
    desc: >
      Visualization functions for enrichment analysis results.
    contents:
    - plotBubble
    - plotES

  - title: Utilities
    desc: >
      Helper functions for data preparation and manipulation.
    contents:
    - df2list

  - title: Data Objects
    desc: Objects provided with `SomaEnrich`.
    contents:
    - example_data_11k
    - t_tests
    - pathway_map
    - ex_apt_pathway
    - ex_gene_pathway

news:
  - one_page: true
